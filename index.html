<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Équilibre</title><meta name="theme-color" id="tc" content="#0f1f19">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Équilibre">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f1f19'/%3E%3Ccircle cx='32' cy='34' r='16' fill='%236b9a78'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap">
<style>
:root{--bg:#f6f1ea;--card:#fff;--card2:#eee8df;--tx:#17251d;--mut:#6b766f;--ac:#5f8f6e;--acx:#fff;--or:#e07b4f;--hero:#1d4a33;--bd:#ddd5c8;--rd:#c0492f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0f1f19;--card:#16291f;--card2:#1d3427;--tx:#f3efe6;--mut:#9bab9f;--ac:#6b9a78;--acx:#0f1f19;--hero:#2f5c43;--bd:#27402f;--rd:#e5755a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 'DM Sans',system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:14px 16px 90px}
.lab{color:var(--or);font-size:11px;letter-spacing:.18em;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.top h1{font-size:34px}.sub{color:var(--mut);font-size:13px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:10px}
.nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px;margin-bottom:12px;font-weight:700}
.hero{background:var(--hero);border-radius:24px;padding:16px;margin-bottom:12px;color:#f3efe6}
.big{font:700 44px Fraunces,serif}.bar{height:8px;border-radius:8px;background:rgba(0,0,0,.3);margin:8px 0}
.bar i{display:block;height:100%;border-radius:8px;background:#e9e3d3}
.mac{display:flex;gap:8px}.mac div{flex:1;background:rgba(0,0,0,.22);border-radius:14px;padding:8px;font-size:11px}.mac b{display:block;font-size:15px}
.row{display:flex;align-items:center;gap:10px}.row .g{flex:1}.row b{display:block}
.ico{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.btn{width:100%;border:0;border-radius:24px;padding:15px;background:var(--ac);color:var(--acx);font:700 15px 'DM Sans',sans-serif;cursor:pointer}
.fab{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.tabs{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 0 4px}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:500 11px 'DM Sans',sans-serif;cursor:pointer;padding:4px}.tabs button span{display:block;font-size:20px}
.tabs .on{color:var(--ac);font-weight:700}
.days{display:flex;gap:6px;margin-bottom:12px}.days button{flex:1;padding:8px 0;border-radius:14px;border:0;background:var(--card);color:var(--tx);font:700 16px Fraunces,serif;cursor:pointer}
.days small{display:block;font:500 10px 'DM Sans';color:var(--mut)}.days .on{background:var(--ac);color:var(--acx)}.days .on small{color:var(--acx)}.days .today{color:var(--or)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}.empty h3{color:var(--tx);font-size:17px;margin:8px 0 4px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:5}
.sh{background:var(--bg);width:100%;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.sh h2{font-size:22px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
input,textarea{width:100%;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:13px;font:15px 'DM Sans',sans-serif;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 13px;font:500 13px 'DM Sans';cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.two{display:flex;gap:8px}.msg{max-width:85%;padding:11px 14px;border-radius:18px;margin-bottom:8px;white-space:pre-wrap}
.bot{background:var(--card);border:1px solid var(--bd)}.me{background:var(--ac);color:var(--acx);margin-left:auto}
.link{background:none;border:0;color:var(--ac);font:600 13px 'DM Sans';cursor:pointer;padding:4px 0 10px}
.del{background:none;border:0;color:var(--mut);font-size:17px;cursor:pointer}
.wel{height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;background:linear-gradient(180deg,#27502f 0,#0f1f19 75%);color:#f3efe6}
.wel h1{font-size:54px}.wel input{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.note{font-size:12px;color:var(--mut);margin:8px 2px}
</style></head><body><div id="app"></div>
<script>
const K="equilibre-v1",$=s=>document.querySelector(s);
let S=Object.assign({name:"",kcal:2200,theme:"dark",lang:"fr",height:0,weights:[],meals:[],sess:[],goals:[],chat:[]},(()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}})());
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const L=(a,b)=>S.lang=="fr"?a:b, esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromKey=k=>{const[a,b,c]=k.split("-");return new Date(a,b-1,c)};
const add=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return key(d)};
const wd=k=>(fromKey(k).getDay()+6)%7, TODAY=key(new Date()), id=()=>Date.now()+""+Math.random().toString(36).slice(2,6);
const loc=()=>S.lang=="fr"?"fr-FR":"en-GB";
const lbl=k=>(k==TODAY?L("Aujourd’hui · ","Today · "):"")+fromKey(k).toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"}).replace(/^./,c=>c.toUpperCase());
const DL=()=>L(["L","M","M","J","V","S","D"],["M","T","W","T","F","S","S"]);
let tab="nut",day=TODAY,sheet=null,showSet=false,busy=false;
const occ=(x,k)=>x.rep=="once"?x.d==k:k>=x.d&&(x.rep=="daily"||x.days.includes(wd(k)));
document.documentElement.dataset.theme=S.theme;$("#tc").content=S.theme=="dark"?"#0f1f19":"#f6f1ea";
function setTab(t){tab=t;showSet=false;render()}
function head(t,sub){return `<div class="top"><div><div class="lab">ÉQUILIBRE</div><h1>${t}</h1><div class="sub">${sub}</div></div><button class="ib" onclick="showSet=true;render()">⚙</button></div>`}
function dnav(){return `<div class="nav"><button class="ib" onclick="day=add(day,-1);render()">‹</button><span>${lbl(day)}</span><button class="ib" onclick="day=add(day,1);render()">›</button></div>`}
function wnav(){const m=add(day,-wd(day));let h=`<div class="nav"><button class="ib" onclick="day=add(day,-7);render()">‹</button><span>${L("Semaine du ","Week of ")}${fromKey(m).toLocaleDateString(loc(),{day:"numeric",month:"short"})}</span><button class="ib" onclick="day=add(day,7);render()">›</button></div><div class="days">`;
const has=k=>tab=="sport"?S.sess.some(s=>occ(s,k)):S.goals.some(g=>occ(g,k));for(let i=0;i<7;i++){const k=add(m,i);h+=`<button class="${k==day?"on":""} ${k==TODAY?"today":""}" onclick="day='${k}';render()"><small>${DL()[i]}</small>${fromKey(k).getDate()}<i style="display:block;width:5px;height:5px;border-radius:50%;background:var(--or);margin:3px auto 0;opacity:${has(k)?1:0}"></i></button>`}return h+"</div>"}
function nut(){const ms=S.meals.filter(m=>m.d==day),t=ms.reduce((a,m)=>(a.k+=m.k,a.p+=m.p,a.c+=m.c,a.l+=m.l,a),{k:0,p:0,c:0,l:0}),pc=Math.min(100,t.k/S.kcal*100);
return head("Nutrition",L("Calories du jour","Calories today"))+dnav()+`<div class="hero"><div class="sub" style="color:#c8d4c8">Calories</div><span class="big">${t.k}</span> / ${S.kcal}<div class="bar"><i style="width:${pc}%"></i></div>${L("Reste ","Left ")}${Math.max(0,S.kcal-t.k)} kcal<div class="mac" style="margin-top:10px"><div><b>${t.p} g</b>${L("Protéines","Protein")}</div><div><b>${t.c} g</b>${L("Glucides","Carbs")}</div><div><b>${t.l} g</b>${L("Lipides","Fat")}</div></div></div>`+`<button class="btn" style="margin:2px 0 14px" onclick="openMeal()">＋ ${L("Ajouter un aliment","Add food")}</button>`+
(ms.length?ms.map(m=>`<div class="card row"><div class="ico">🍴</div><div class="g" onclick="openMeal('${m.id}')"><b>${esc(m.n)}</b><span class="sub">${m.p}P · ${m.c}G · ${m.l}L</span></div><b>${m.k} kcal</b><button class="del" onclick="del('meals','${m.id}')">🗑</button></div>`).join(""):`<div class="empty"><div style="font-size:32px">🍴</div><h3>${L("Rien d’enregistré ce jour-là.","Nothing logged that day.")}</h3>${L("Ajoutez votre premier repas pour suivre vos calories.","Add your first meal to track calories.")}</div>`)+bmiCard()}
function sport(){const w=add(day,-wd(day)),min=[...Array(7)].reduce((a,_,i)=>a+S.sess.filter(s=>occ(s,add(w,i))).reduce((b,s)=>b+s.dur,0),0),ss=S.sess.filter(s=>occ(s,day)).sort((a,b)=>a.h<b.h?-1:1);
return head("Sport",min+L(" min prévues cette semaine"," min planned this week"))+wnav()+`<h2 style="margin-bottom:10px">${lbl(day)}</h2>`+
(ss.length?ss.map(s=>`<div class="card row"><button class="ib" style="${(s.done||{})[day]?"background:var(--ac);color:var(--acx)":""}" onclick="togS('${s.id}')">${(s.done||{})[day]?"✓":""}</button><div><b style="${(s.done||{})[day]?"text-decoration:line-through;opacity:.6":""}">${s.h}</b><span class="sub">${s.dur} min</span></div><div class="ico">${ACT[s.type]||"⚡"}</div><div class="g" onclick="openSess('${s.id}')"><b style="${(s.done||{})[day]?"text-decoration:line-through;opacity:.6":""}">${esc(s.type)}</b><span class="sub">${s.rep=="once"?"":"↻ "+(s.rep=="daily"?L("Tous les jours","Every day"):s.days.map(d=>DL()[d]).join(" "))} ${esc(s.notes||"")}</span></div><button class="del" onclick="del('sess','${s.id}')">🗑</button></div>`).join(""):`<div class="empty"><div style="font-size:32px">🌿</div><h3>${L("Jour de repos","Rest day")}</h3>${L("Rien de prévu. Profitez-en pour récupérer.","Nothing planned. Enjoy the recovery.")}</div>`)+
`<button class="btn fab" onclick="openSess()">＋ ${L("Planifier une séance","Plan a session")}</button>`}
const ACT={"Course à pied":"🏃","Salle de sport":"🏋️","Natation":"🏊","Vélo":"🚴","Marche":"🚶","Sport collectif":"⚽","Autre":"⚡"};
function goals(){const gs=S.goals.filter(g=>occ(g,day)),dn=gs.filter(g=>g.done[day]).length;
return head(L("Objectifs","Goals"),L("Vos objectifs personnels","Your personal goals"))+wnav()+`<h2 style="margin-bottom:10px">${lbl(day)}</h2><div class="card row"><div class="g"><span class="sub">${L("Accompli ce jour","Done today")}</span><div class="big" style="font-size:30px">${dn} / ${gs.length}</div></div><div style="font-size:26px">${gs.length&&dn==gs.length?"🏆":"🚩"}</div></div>`+
(gs.length?gs.map(g=>`<div class="card row"><button class="ib" style="${g.done[day]?"background:var(--ac);color:var(--acx)":""}" onclick="tog('${g.id}')">${g.done[day]?"✓":""}</button><div class="g" onclick="openGoal('${g.id}')"><b style="${g.done[day]?"text-decoration:line-through;opacity:.6":""}">${esc(g.t)}</b><span class="sub">${esc(g.cat)} · ${g.rep=="once"?L("Une fois","Once"):g.rep=="daily"?L("Tous les jours","Every day"):g.days.map(d=>DL()[d]).join(" ")}</span></div><button class="del" onclick="del('goals','${g.id}')">🗑</button></div>`).join(""):`<div class="empty"><div style="font-size:32px">🚩</div><h3>${L("Aucun objectif pour ce jour.","No goals for this day.")}</h3>${L("Fixez-vous un petit objectif atteignable.","Set a small, reachable goal.")}</div>`)+
`<button class="btn fab" onclick="openGoal()">＋ ${L("Ajouter un objectif","Add a goal")}</button>`}
function settings(){return `<div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="ib" onclick="showSet=false;render()">‹</button><div><div class="lab">ÉQUILIBRE</div><h1 style="font-size:28px">${L("Paramètres","Settings")}</h1></div></div></div>
<div class="card row"><div class="ico" style="background:var(--ac);color:var(--acx);border-radius:50%;font-weight:700">${esc((S.name||"?")[0].toUpperCase())}</div><div><b>${esc(S.name||"")}</b><span class="sub">${L("Profil enregistré sur cet appareil","Profile stored on this device")}</span></div></div>
<div class="card"><b>${L("Objectif calorique (kcal)","Calorie goal (kcal)")}</b><div class="two" style="margin-top:8px"><input id="kc" type="number" inputmode="numeric" value="${S.kcal}" style="margin:0"><button class="btn" style="width:auto;padding:0 18px" onclick="S.kcal=+$('#kc').value||2200;save();render()">OK</button></div></div>
<div class="card"><b>${L("Thème","Theme")}</b><div class="two" style="margin-top:8px"><button class="chip ${S.theme=="light"?"on":""}" style="flex:1" onclick="theme('light')">☀ ${L("Clair","Light")}</button><button class="chip ${S.theme=="dark"?"on":""}" style="flex:1" onclick="theme('dark')">☾ ${L("Sombre","Dark")}</button></div></div>
<div class="card"><b>${L("Langue","Language")}</b><div class="two" style="margin-top:8px"><button class="chip ${S.lang=="fr"?"on":""}" style="flex:1" onclick="setLang('fr')">Français</button><button class="chip ${S.lang=="en"?"on":""}" style="flex:1" onclick="setLang('en')">English</button></div></div>
<div class="card"><b>${L("Installer et partager","Install and share")}</b><div class="note" style="margin:6px 0 10px">${L("Android (Chrome) : menu ⋮ → « Installer l’application ». iPhone (Safari) : bouton Partager → « Sur l’écran d’accueil ».","Android (Chrome): ⋮ menu → “Install app”. iPhone (Safari): Share → “Add to Home Screen”.")}</div><div class="two">${DI?`<button class="btn" onclick="inst()">${L("Installer","Install")}</button>`:""}<button class="btn" onclick="share()">${L("Partager le lien","Share link")}</button></div></div>
<button class="chip" style="width:100%;margin-bottom:8px;padding:14px" onclick="ask2('out')">⎋ ${L("Se déconnecter","Sign out")}</button>
<button class="chip" style="width:100%;padding:14px;color:var(--rd)" onclick="ask2('wipe')">${L("Effacer toutes mes données","Erase all my data")}</button>
<div class="note">Équilibre v1 · ${L("Données stockées uniquement sur cet appareil (pas de synchronisation).","Data stored on this device only (no sync).")}</div>`}
function theme(t){S.theme=t;document.documentElement.dataset.theme=t;$("#tc").content=t=="dark"?"#0f1f19":"#f6f1ea";save();render()}
function setLang(l){S.lang=l;document.documentElement.lang=l;save();render()}
function del(c,i){S[c]=S[c].filter(x=>x.id!=i);save();render()}
const fmt=n=>(Math.round(n*10)/10).toFixed(1).replace(".",S.lang=="fr"?",":".");
const sd=k=>fromKey(k).toLocaleDateString(loc(),{day:"numeric",month:"short"});
function wchart(ws){ws=ws.slice(-30);
if(!ws.length)return `<div class="empty" style="padding:16px 10px 8px"><div style="font-size:28px">📈</div>${L("Ajoute ton premier poids pour voir ta courbe.","Add your first weight to see your curve.")}</div>`;
const W=320,H=150,l=38,r=12,t=14,b=24,xs=ws.map(p=>fromKey(p.d).getTime()),x0=xs[0],x1=xs[xs.length-1],vs=ws.map(p=>p.w);
let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<1){lo-=1;hi+=1}else{const m=(hi-lo)*.15;lo-=m;hi+=m}
const X=i=>ws.length==1||x1==x0?l+(W-l-r)/2:l+(xs[i]-x0)/(x1-x0)*(W-l-r),Y=v=>t+(hi-v)/(hi-lo)*(H-t-b),tx="fill:var(--mut);font:10px 'DM Sans',sans-serif";
let g="";[0,.5,1].forEach(f=>{const v=lo+(hi-lo)*f,y=Y(v);g+=`<line x1="${l}" x2="${W-r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--bd);stroke-width:1"/><text x="${l-6}" y="${(y+3).toFixed(1)}" text-anchor="end" style="${tx}">${fmt(v)}</text>`});
const d=ws.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.w).toFixed(1)).join(" ");
const dots=ws.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="${i==ws.length-1?5:3.5}" style="fill:${i==ws.length-1?"var(--or)":"var(--ac)"}"/>`).join("");
const lab=ws.length>1?`<text x="${l}" y="${H-6}" style="${tx}">${sd(ws[0].d)}</text><text x="${W-r}" y="${H-6}" text-anchor="end" style="${tx}">${sd(ws[ws.length-1].d)}</text>`:`<text x="${X(0).toFixed(1)}" y="${H-6}" text-anchor="middle" style="${tx}">${sd(ws[0].d)}</text>`;
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin:10px 0 4px">${g}<path d="${d}" style="fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/>${dots}${lab}</svg>`}
function bmiCard(){const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0),last=ws[ws.length-1],h=+S.height||0;
let bmi=null,cat="";if(last&&h){bmi=last.w/((h/100)*(h/100));cat=bmi<18.5?L("Insuffisance pondérale","Underweight"):bmi<25?L("Corpulence normale","Normal weight"):bmi<30?L("Surpoids","Overweight"):L("Obésité","Obesity")}
const dl=ws.length>1?last.w-ws[0].w:0,dt=ws.length>1?`${dl>0?"+":""}${fmt(dl)} kg ${L("depuis le début","since the start")}`:"";
return `<div class="card" style="margin-top:14px"><div class="row" style="margin-bottom:10px"><div class="g"><b>${L("Poids & IMC","Weight & BMI")}</b><span class="sub">${dt||L("Suis ton évolution","Track your progress")}</span></div><button class="chip" onclick="openHeight()">📏 ${h?h+" cm":L("Ma taille","My height")}</button></div>
<div class="two"><div style="flex:1"><div class="sub">${L("Poids","Weight")}</div><div class="big" style="font-size:30px">${last?fmt(last.w):"–"}<span class="sub"> kg</span></div></div><div style="flex:1"><div class="sub">${L("IMC","BMI")}</div><div class="big" style="font-size:30px">${bmi?fmt(bmi):"–"}</div><span class="sub">${bmi?cat:h?"":L("Ajoute ta taille","Add your height")}</span></div></div>
${wchart(ws)}
${ws.slice(-5).reverse().map(p=>`<div class="row" style="padding:4px 0;border-top:1px solid var(--bd)"><span class="sub g">${sd(p.d)}</span><b style="display:inline">${fmt(p.w)} kg</b><button class="del" onclick="del('weights','${p.id}')">🗑</button></div>`).join("")}
<button class="btn" style="margin-top:10px" onclick="openWeight()">＋ ${L("Ajouter mon poids","Add my weight")}</button>
<div class="note">${L("L’IMC est un repère général : il ne tient pas compte de la masse musculaire.","BMI is a general guide: it does not account for muscle mass.")}</div></div>`}
function openWeight(){const c=S.weights.find(x=>x.d==day);shell(L("Ajouter mon poids","Add my weight"),`<div class="sub" style="margin-bottom:6px">${lbl(day)}</div><input id="wv" type="text" inputmode="decimal" placeholder="${L("Ex : 72,5","E.g. 72.5")}" value="${c?c.w:""}"><button class="btn" onclick="saveWeight()">${L("Enregistrer","Save")}</button>`)}
function saveWeight(){const v=parseFloat(String($("#wv").value).replace(",","."));if(!(v>=20&&v<=400))return toast(L("Entre un poids valide (en kg).","Enter a valid weight (kg)."));S.weights=S.weights.filter(x=>x.d!=day);S.weights.push({id:id(),d:day,w:Math.round(v*10)/10});save();closeSheet()}
function openHeight(){shell(L("Ma taille","My height"),`<input id="hv" type="text" inputmode="numeric" placeholder="${L("Ex : 178 (en cm)","E.g. 178 (in cm)")}" value="${S.height||""}"><button class="btn" onclick="saveHeight()">${L("Enregistrer","Save")}</button>`)}
function saveHeight(){const v=parseInt($("#hv").value,10);if(!(v>=100&&v<=250))return toast(L("Entre une taille valide (en cm).","Enter a valid height (cm)."));S.height=v;save();closeSheet()}
function togS(i){const s=S.sess.find(x=>x.id==i);s.done=s.done||{};s.done[day]=!s.done[day];save();render()}
function tog(i){const g=S.goals.find(x=>x.id==i);g.done[day]=!g.done[day];save();render()}
function shell(t,body){sheet={t,body};render()}
function closeSheet(){sheet=null;render()}
let F={};
function pills(list,cur,fn){return `<div class="chips">${list.map(x=>`<button class="chip ${x==cur?"on":""}" onclick="${fn}('${x}')">${x}</button>`).join("")}</div>`}
function repUI(){const r=F.rep;return `<div class="sub" style="margin-bottom:6px">${L("Répétition","Repeat")}</div><div class="chips">${[["once",L("Une fois","Once")],["daily",L("Tous les jours","Every day")],["days",L("Certains jours","Some days")]].map(([v,n])=>`<button class="chip ${r==v?"on":""}" onclick="F.rep='${v}';sync()">${n}</button>`).join("")}</div>`+(r=="days"?`<div class="chips">${DL().map((d,i)=>`<button class="chip ${F.days.includes(i)?"on":""}" onclick="F.days=F.days.includes(${i})?F.days.filter(x=>x!=${i}):[...F.days,${i}];sync()">${d}</button>`).join("")}</div>`:"")}
function grab(){document.querySelectorAll("[data-f]").forEach(e=>F[e.dataset.f]=e.value)}
function sync(){grab();openers[F.kind]()}
const openers={meal(){const m=F;shell(L("Ajouter un aliment","Add food"),`<div class="two"><input data-f="n" placeholder="${L("Aliment ou repas","Food or meal")}" value="${esc(m.n||"")}"><input data-f="k" type="number" inputmode="numeric" placeholder="kcal" value="${m.k||""}" style="max-width:100px"></div><button class="link" onclick="F.mx=!F.mx;sync()">${F.mx?"−":"+"} ${L("Protéines / glucides / lipides","Protein / carbs / fat")}</button>${F.mx?`<div class="two"><input data-f="p" type="number" placeholder="P g" value="${m.p||""}"><input data-f="c" type="number" placeholder="G g" value="${m.c||""}"><input data-f="l" type="number" placeholder="L g" value="${m.l||""}"></div>`:""}<button class="btn" onclick="saveMeal()">${m.id?L("Enregistrer","Save"):"＋ "+L("Ajouter","Add")}</button>`)},
sess(){const a=Object.keys(ACT);shell(L("Planifier une séance","Plan a session"),`<div class="chips">${a.map(x=>`<button class="chip ${F.type==x?"on":""}" onclick="F.type='${x}';sync()">${ACT[x]} ${x}</button>`).join("")}</div><div class="two"><div style="flex:1"><div class="sub">${L("Heure","Time")}</div><input data-f="h" type="time" value="${F.h}"></div><div style="flex:1"><div class="sub">${L("Durée (min)","Duration (min)")}</div><input data-f="dur" type="number" inputmode="numeric" value="${F.dur}"></div></div><input data-f="notes" placeholder="${L("Notes (ex : 10 km, haut du corps…)","Notes (e.g. 10 km, upper body…)")}" value="${esc(F.notes||"")}">${repUI()}<button class="btn" onclick="saveSess()">${F.id?L("Enregistrer","Save"):L("Planifier","Plan")}</button>`)},
goal(){const c=[L("Lecture","Reading"),"Sport",L("Travail","Work"),L("Études","Study"),L("Finances","Finance"),L("Social","Social"),L("Autre","Other")];shell(L("Ajouter un objectif","Add a goal"),`${pills(c,F.cat,"setCat")}<input data-f="t" placeholder="${L("Ex : lire 20 pages, faire le budget du mois…","E.g. read 20 pages, do the monthly budget…")}" value="${esc(F.t||"")}">${repUI()}<button class="btn" onclick="saveGoal()">${F.id?L("Enregistrer","Save"):L("Ajouter","Add")}</button>`)}};
let DI=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();DI=e;if(showSet)render()});
function inst(){if(DI){DI.prompt();DI=null;render()}}
function share(){const u=location.href.split("#")[0];if(navigator.share)navigator.share({title:"Équilibre",url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u);toast(L("Lien copié","Link copied"))}catch(e){toast(u)}}}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
function toast(m){const e=document.createElement("div");e.textContent=m;e.style.cssText="position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);background:#e07b4f;color:#fff;padding:10px 16px;border-radius:20px;z-index:99;font-weight:700";document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function ask2(w){const out=w=="out";shell(out?L("Se déconnecter ?","Sign out?"):L("Tout effacer ?","Erase everything?"),`<p class="sub" style="margin:0 0 14px">${out?L("Vos données restent sur cet appareil.","Your data stays on this device."):L("Repas, séances et objectifs seront supprimés définitivement.","Meals, sessions and goals will be permanently deleted.")}</p><div class="two"><button class="chip" style="flex:1;padding:14px" onclick="closeSheet()">${L("Annuler","Cancel")}</button><button class="btn" style="flex:1" onclick="${out?"S.name='';save();closeSheet()":"wipe()"}">OK</button></div>`)}
function wipe(){try{localStorage.removeItem(K)}catch(e){}S={name:"",kcal:2200,theme:"dark",lang:"fr",height:0,weights:[],meals:[],sess:[],goals:[],chat:[]};document.documentElement.dataset.theme="dark";sheet=null;showSet=false;render()}
function setCat(c){grab();F.cat=c;openers.goal()}
function openMeal(i){const m=S.meals.find(x=>x.id==i);F=m?{...m,kind:"meal",mx:true}:{kind:"meal"};openers.meal()}
function openSess(i){const s=S.sess.find(x=>x.id==i);F=s?{...s,kind:"sess"}:{kind:"sess",type:"Salle de sport",h:"18:00",dur:45,notes:"",rep:"once",days:[]};openers.sess()}
function openGoal(i){const g=S.goals.find(x=>x.id==i);F=g?{...g,kind:"goal"}:{kind:"goal",cat:L("Lecture","Reading"),t:"",rep:"once",days:[]};openers.goal()}
function upsert(c,o){const i=S[c].findIndex(x=>x.id==o.id);i<0?S[c].push(o):S[c][i]=o;save();closeSheet()}
function saveMeal(){grab();if(!F.n||!F.n.trim())return toast(L("Indiquez un nom.","Enter a name."));upsert("meals",{id:F.id||id(),d:F.d||day,n:F.n.trim(),k:+F.k||0,p:+F.p||0,c:+F.c||0,l:+F.l||0})}
function saveSess(){grab();upsert("sess",{id:F.id||id(),d:F.d||day,type:F.type,h:F.h||"18:00",dur:+F.dur||30,notes:F.notes||"",rep:F.rep,days:F.rep=="days"&&F.days.length?F.days:F.rep=="days"?[wd(day)]:[],done:F.done||{}})}
function saveGoal(){grab();if(!F.t||!F.t.trim())return toast(L("Décrivez l’objectif.","Describe the goal."));upsert("goals",{id:F.id||id(),d:F.d||day,cat:F.cat,t:F.t.trim(),rep:F.rep,days:F.rep=="days"&&F.days.length?F.days:F.rep=="days"?[wd(day)]:[],done:F.done||{}})}
function welcome(){return `<div class="wel"><div class="lab" style="margin-bottom:auto;padding-top:20px">ÉQUILIBRE</div><h1>Équilibre</h1><p style="font-size:18px;margin:8px 0 24px">${L("Nutrition, sport et objectifs, en un seul endroit calme.","Nutrition, sport and goals, in one calm place.")}</p><input id="nm" placeholder="${L("Votre prénom","Your first name")}"><button class="btn" style="background:#f6f1ea;color:#0f1f19" onclick="start()">${L("Commencer","Get started")}</button><div style="font-size:12px;opacity:.75;margin-top:10px">${L("Vos données restent sur cet appareil. La connexion Google nécessite un serveur : elle sera ajoutée plus tard.","Your data stays on this device. Google sign-in needs a server and will be added later.")}</div></div>`}
function start(){const v=$("#nm").value.trim();if(!v)return $("#nm").focus();S.name=v;save();render()}
function render(){const a=$("#app");if(!S.name){a.innerHTML=welcome();return}
const v={nut,sport,goals}[tab],T=[["nut","🍎","Nutrition"],["sport","🏋️","Sport"],["goals","🚩",L("Objectifs","Goals")]];
a.innerHTML=`<main>${showSet?settings():v()}</main>`+(showSet?"":`<div class="tabs">${T.map(([k,i,n])=>`<button class="${tab==k?"on":""}" onclick="setTab('${k}')"><span>${i}</span>${n}</button>`).join("")}</div>`)+(sheet?`<div class="ov" onclick="if(event.target==this)closeSheet()"><div class="sh"><h2>${sheet.t}<button class="ib" onclick="closeSheet()">✕</button></h2>${sheet.body}</div></div>`:"")}
render();
</script></body></html>
